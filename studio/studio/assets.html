<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign assets — ShootFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="index.html"><span class="wordmark__glyph" aria-hidden="true"></span>ShootFlow</a>
      <nav class="primary-nav" id="primaryNav" aria-label="Primary">
        <a href="dash-team.html">Dashboard</a>
        <a href="project.html">Project</a>
        <a class="nav-cta" href="assets.html">Assets</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main id="main" class="page-main">
    <div class="shell page-intro">
      <p class="eyebrow">Campaign assets</p>
      <h1 class="page-title">124 images</h1>
      <p class="page-lede">Preview · Download · Share</p>
      <div class="approve-banner">
        <strong>Marketing team approval</strong>
        108 approved · 16 revisions requested
      </div>
    </div>
    <div class="shell">
      <div class="filters" role="group" aria-label="Filter assets">
        <button class="filter is-active" type="button" data-asset="all">All</button>
        <button class="filter" type="button" data-asset="final">Final</button>
        <button class="filter" type="button" data-asset="social">Social</button>
        <button class="filter" type="button" data-asset="web">Web</button>
        <button class="filter" type="button" data-asset="print">Print</button>
        <button class="filter" type="button" data-asset="retouched">Retouched</button>
        <button class="filter" type="button" data-asset="raw">RAW</button>
      </div>
      <div class="asset-grid" id="assetGrid">
        <figure class="asset" data-asset="final social"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&amp;fit=crop&amp;w=600&amp;q=80" alt="Final social crop"><figcaption>Final · Social</figcaption></figure>
        <figure class="asset" data-asset="final web"><img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?auto=format&amp;fit=crop&amp;w=600&amp;q=80" alt="Web master"><figcaption>Final · Web</figcaption></figure>
        <figure class="asset" data-asset="print retouched"><img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&amp;fit=crop&amp;w=600&amp;q=80" alt="Print retouched"><figcaption>Print · Retouched</figcaption></figure>
        <figure class="asset" data-asset="raw"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&amp;fit=crop&amp;w=600&amp;q=80" alt="RAW file preview"><figcaption>RAW</figcaption></figure>
        <figure class="asset" data-asset="final social"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&amp;fit=crop&amp;w=600&amp;q=80" alt="Social crop 2"><figcaption>Final · Social</figcaption></figure>
        <figure class="asset" data-asset="web retouched"><img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&amp;fit=crop&amp;w=600&amp;q=80" alt="Web retouched"><figcaption>Web · Retouched</figcaption></figure>
      </div>
    </div>
  </main>
  <footer class="site-footer"><div class="shell"><div class="footer-bottom"><p>© 2026 ShootFlow</p></div></div></footer>
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
